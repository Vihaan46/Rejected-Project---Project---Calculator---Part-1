<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <h1 id="app-title">heera's bank</h1>
        <div id="balance-box">
            <p id="balance-label">Available Balance</p>
            <p id="balance">1000</p>
            <div id="entry-box">
                <label id="amount-label" for="amount">Enter amount</label>
                <input type="number" id="amount" placeholder="0">
                <div id="button-box">
                    <button class="action credit" id="credit-btn">Credit</button>
                    <button class="action debit" id="debit-btn">Debit</button>
                </div>
                <p id="note">Terms and Conditions apply</p>
                <p id="message"></p>
            </div>
        </div>
    </div>
</body>
</html>
